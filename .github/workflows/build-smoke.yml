name: Build Smoke

on:
  pull_request:
  workflow_dispatch:

jobs:
  swift-build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.10"

      - name: Build package
        run: swift build --package-path Glass -c release

      - name: Build app bundle
        run: ./Glass/BuildSupport/build-app.sh

      - name: Verify packaged app exists
        run: test -f Glass/build/Glass.app/Contents/MacOS/Glass
